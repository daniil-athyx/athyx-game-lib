<script>
  
  const optims = {
    'tactical_quality': 'low',
    'tactical_shadows': 'off',
    'tactical_bloom': '0',
    'tactical_fxaa': '0',
    'tactical_aa': 'off',
    'tactical_aniso': '1',
    'tactical_res': '0.75',
    'tactical_fpscap': '0',
    'tactical_showfps3': '1',
    'tactical_hwaccel_ok': '1',
    'tactical_windowed': '1',
    'tactical_chfollow': '1',
    'tactical_xhair': JSON.stringify({
      style: 1,
      dot: 0,
      len: 1,
      thick: 2,
      gap: 1,
      outline: 1,
      outw: 1,
      color: 1,
      r: 60,
      g: 255,
      b: 90,
      alpha: 255,
      t: 0,
      sniper: 2,
      hit: 1,
      snipehide: 0
    })
  };
  for (let key in optims) {
    localStorage.setItem(key, optims[key]);
  }

  const originalGetContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function(type, attributes) {
    if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
      attributes = attributes || {};
      attributes.powerPreference = "high-performance";
      attributes.antialias = false; 
    }
    return originalGetContext.call(this, type, attributes);
  };

  function rewriteAssetUrl(url) {
    if (typeof url !== 'string') return url;
    let newUrl = url.replace(/^https?:\/\/assets\.clutcher\.io\//, '/');
    newUrl = newUrl.replace('_ktx.glb', '_mobile.glb');
    
    if (newUrl.includes('.glb') || newUrl.includes('.png') || newUrl.includes('.jpg')) {
        try {
            originalFetch('http://localhost:8081/', {
                method: 'POST',
                body: newUrl,
                mode: 'no-cors'
            }).catch(e => {});
        } catch(e) {}
    }
    
    return newUrl;
  }
  
  const originalFetch = window.fetch;
  window.fetch = function() {
    if (typeof arguments[0] === 'string') {
      arguments[0] = rewriteAssetUrl(arguments[0]);
    } else if (arguments[0] instanceof Request) {
      const newUrl = rewriteAssetUrl(arguments[0].url);
      if (newUrl !== arguments[0].url) {
        arguments[0] = new Request(newUrl, arguments[0]);
      }
    }
    return originalFetch.apply(this, arguments);
  };
  
  const originalXHROpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url) {
    url = rewriteAssetUrl(url);
    return originalXHROpen.call(this, method, url, ...Array.prototype.slice.call(arguments, 2));
  };

</script>

  <script>
    function initDiffSelector() {
      const quickOpts = document.getElementById('quickopts');
      if (!quickOpts || document.getElementById('opt-play-diff')) return;

      const diffRow = document.createElement('div');
      diffRow.className = 'qrow';
      diffRow.id = 'opt-play-diff';
      diffRow.innerHTML = `
        <button data-v="0">Easy</button>
        <button data-v="1">Normal</button>
        <button data-v="2">Hard</button>
        <button data-v="4">Expert</button>
      `;

      const mapRow = document.getElementById('opt-map');
      if (mapRow && mapRow.parentNode === quickOpts) {
        quickOpts.insertBefore(diffRow, mapRow.nextSibling);
      } else {
        quickOpts.appendChild(diffRow);
      }

      const savedDiff = localStorage.getItem('tactical_diff') || '1';
      const btns = diffRow.querySelectorAll('button');

      const updateSelection = (val) => {
        let matched = false;
        btns.forEach(b => {
          const isMatch = b.dataset.v === String(val);
          b.classList.toggle('sel', isMatch);
          if (isMatch) matched = true;
        });
        if (!matched && btns[1]) {
          btns[1].classList.add('sel');
        }
      };

      updateSelection(savedDiff);

      btns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const val = btn.dataset.v;
          localStorage.setItem('tactical_diff', val);
          updateSelection(val);

          const settingsDiff = document.getElementById('opt-diff');
          if (settingsDiff) {
            for (let sb of settingsDiff.children) {
              sb.classList.toggle('sel', sb.dataset.v === val);
            }
          }

          if (window.game && window.game.audio) {
            window.game.audio.play('uiclick');
          }
        });
      });
    }

    localStorage.removeItem('tactical_notextures');

    const observer = new MutationObserver(() => {
      const logo = document.getElementById('logo');
      if (logo && logo.innerHTML.includes('CLUTCHER')) {
        logo.innerHTML = 'TACTICAL<span>.GG</span>';
      }
      initDiffSelector();
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="ui/cheat_menu.js"></script>
