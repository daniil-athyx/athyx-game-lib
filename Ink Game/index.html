<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Ink%20Game/">
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>Ink Game</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Ink%20Game/style.css"/>
    <style>
        canvas:focus { outline: none; }
        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            height: 100%;
            width: 100%;
            background: #111;
        }
        #unity-container, #unity-canvas {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body class="dark">
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loading-cover">
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>
    <script>
        var BASE_URL = "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Ink%20Game/";
        var buildUrl = BASE_URL + "Build";
        var loaderUrl = buildUrl + "/SquidGame.loader.js";

        var config = {
            dataUrl: buildUrl + "/SquidGame.data.unityweb",
            frameworkUrl: buildUrl + "/SquidGame.framework.js.unityweb",
            codeUrl: buildUrl + "/SquidGame.wasm.unityweb",
            streamingAssetsUrl: BASE_URL + "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Ink Game",
            productVersion: "0.1",
            cacheControl: function () { return "no-store"; }
        };

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingCover = document.querySelector("#loading-cover");
        var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var spinner = document.querySelector(".spinner");

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
        }

        document.addEventListener("contextmenu", function(event) { event.preventDefault(); });

        function FocusGame() {
            window.focus();
            canvas.focus();
        }
        window.addEventListener("pointerdown", FocusGame);
        window.addEventListener("touchstart", FocusGame);

        var myGameInstance = null;
        var ysdk = null;
        var environmentData = {
            language: "en",
            domain: "default_domain",
            deviceType: "desktop",
            isMobile: false,
            isDesktop: true,
            isTablet: false,
            isTV: false,
            appID: "default_app_id",
            browserLang: navigator.language || "en",
            payload: null,
            promptCanShow: false,
            reviewCanShow: false,
            platform: navigator.platform,
            browser: "Chrome"
        };

        var cloudSaves = "noData";
        var paymentsData = "none";
        var playerData = "noData";
        var player = null;
        var payments = null;
        var initGame = false;
        var nowFullAdOpen = false;

        function GetPayments() { return Promise.resolve("none"); }
        function SaveCloud() {}
        function LoadCloud() { return Promise.resolve("noData"); }
        function InitLeaderboard() { return Promise.resolve("noData"); }
        function StickyAdActivity() {}
        function Review() {}
        function PromptShow() {}
        function InitLeaderboards() {}
        function GetLeaderboardScores() {}
        function SetLeaderboardScores() {}
        function ConsumePurchase() {}
        function ConsumePurchases() {}
        function InitPlayer() { return Promise.resolve("noData"); }
        function OpenAuthDialog() {}
        function FullAdShow() {
            try {
                if (myGameInstance) {
                    myGameInstance.SendMessage("YandexGame", "OpenFullAd");
                    setTimeout(function() {
                        myGameInstance.SendMessage("YandexGame", "CloseFullAd", "true");
                    }, 100);
                }
            } catch (e) {}
        }
        function RewardedShow(id) {
            try {
                if (myGameInstance) {
                    myGameInstance.SendMessage("YandexGame", "OpenVideo");
                    setTimeout(function() {
                        myGameInstance.SendMessage("YandexGame", "RewardVideo", id);
                        myGameInstance.SendMessage("YandexGame", "CloseVideo");
                    }, 100);
                }
            } catch (e) {}
        }
        function InitGame() {
            initGame = true;
        }
        function RequestingEnvironmentData( sendback ) {
            if (myGameInstance) {
                myGameInstance.SendMessage("YandexGame", "SetEnvironmentData", JSON.stringify(environmentData));
            }
        }
        function InitYSDK() {
            if (myGameInstance) {
                myGameInstance.SendMessage("YandexGame", "SetInitializationSDK", JSON.stringify(environmentData));
            }
        }

        window.addEventListener("unhandledrejection", function(event) {
            event.preventDefault();
        });

        (async function() {
            var res = await fetch(loaderUrl);
            var code = await res.text();
            (0, eval)(code);

            createUnityInstance(canvas, config, function(progress) {
                if (spinner) spinner.style.display = "none";
                if (progressBarEmpty) progressBarEmpty.style.display = "";
                if (progressBarFull) progressBarFull.style.width = (100 * progress) + "%";
            }).then(function(unityInstance) {
                myGameInstance = unityInstance;
                if (loadingCover) loadingCover.style.display = "none";
            }).catch(function(message) {
                console.error(message);
            });
        })();
    </script>
</body>
</html>
