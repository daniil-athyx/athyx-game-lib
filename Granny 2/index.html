<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Granny%202/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Granny 2</title>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Granny%202/TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Granny%202/TemplateData/style.css">
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #unityContainer {
            width: 100vw !important;
            height: 100vh !important;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
        }
        #loading-text {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
            font-size: 32px;
            font-weight: bold;
            color: #ff3333;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading-text">LOADING GRANNY 2... 0%</div>
    <div class="webgl-content">
        <div id="unityContainer"></div>
    </div>
    <script>
        var BASE_URL = "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Granny%202/";
        var loadingText = document.querySelector("#loading-text");
        var totalParts = 22;
        var doneParts = 0;

        async function fetchWithRetry(url, retries) {
            retries = retries || 4;
            for (var i = 0; i < retries; i++) {
                try {
                    var res = await fetch(url);
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    var buf = await res.arrayBuffer();
                    doneParts++;
                    var pct = Math.min(100, Math.round((doneParts / totalParts) * 100));
                    if (loadingText) loadingText.textContent = "LOADING GRANNY 2... " + pct + "%";
                    return buf;
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(function(r) { setTimeout(r, 800 * (i + 1)); });
                }
            }
        }

        async function mergeFiles(fileParts) {
            var results = new Array(fileParts.length);
            var nextIdx = 0;
            async function worker() {
                while (nextIdx < fileParts.length) {
                    var idx = nextIdx++;
                    results[idx] = await fetchWithRetry(fileParts[idx], 4);
                }
            }
            await Promise.all([worker(), worker(), worker(), worker()]);
            return URL.createObjectURL(new Blob(results));
        }

        function getParts(file, start, end) {
            var parts = [];
            for (var i = start; i <= end; i++) {
                parts.push(BASE_URL + file + ".part" + i);
            }
            return parts;
        }

        (async function() {
            try {
                var pRes = await fetch(BASE_URL + "TemplateData/UnityProgress.js");
                if (pRes.ok) (0, eval)(await pRes.text());
                var lRes = await fetch(BASE_URL + "Build/UnityLoader.js");
                (0, eval)(await lRes.text());

                var dataUrl = await mergeFiles(getParts("Build/Granny2.data.unityweb", 1, 22));

                var originalOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function(method, url) {
                    var rest = Array.prototype.slice.call(arguments, 2);
                    if (typeof url === "string") {
                        if (url.indexOf("Granny2.data.unityweb") !== -1) {
                            url = dataUrl;
                        } else if (url.indexOf("Granny2.") !== -1 && url.indexOf("http") !== 0 && url.indexOf("blob:") !== 0) {
                            url = BASE_URL + "Build/" + url.split("/").pop();
                        }
                    }
                    return originalOpen.apply(this, [method, url].concat(rest));
                };

                UnityLoader.instantiate("unityContainer", BASE_URL + "Build/Granny2.json", {
                    onProgress: typeof UnityProgress === "function" ? UnityProgress : undefined,
                    Module: {
                        onRuntimeInitialized: function() {
                            if (loadingText) loadingText.style.display = "none";
                        }
                    }
                });
            } catch (err) {
                console.error(err);
                if (loadingText) loadingText.textContent = "Error: " + err.message;
            }
        })();
    </script>
</body>
</html>
