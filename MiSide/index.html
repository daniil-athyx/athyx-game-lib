<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/MiSide/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>MiSide</title>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/MiSide/TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/MiSide/TemplateData/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }
        #unity-container, #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            position: fixed;
            top: 0;
            left: 0;
        }
        #loading-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #fff;
            z-index: 9999;
        }
        #loading-text {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 16px;
        }
        #dl-bar-wrap {
            width: 320px;
            height: 14px;
            background: #2a2a2a;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid #444;
        }
        #dl-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4da6, #a64dff);
            transition: width 0.15s ease;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div id="loading-text">LOADING MISIDE... 0%</div>
        <div id="dl-bar-wrap">
            <div id="dl-bar-fill"></div>
        </div>
    </div>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>
    <script>
        var BASE_URL = "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/MiSide/";
        var loadingOverlay = document.querySelector("#loading-overlay");
        var loadingText = document.querySelector("#loading-text");
        var dlBarFill = document.querySelector("#dl-bar-fill");
        var totalParts = 10;
        var completedParts = 0;

        function updateDownloadProgress() {
            completedParts++;
            var pct = Math.min(100, Math.round((completedParts / totalParts) * 100));
            if (loadingText) loadingText.textContent = "LOADING MISIDE... " + pct + "%";
            if (dlBarFill) dlBarFill.style.width = pct + "%";
        }

        async function fetchWithRetry(url, retries) {
            retries = retries || 4;
            for (var attempt = 0; attempt < retries; attempt++) {
                try {
                    var res = await fetch(url);
                    if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
                    var buf = await res.arrayBuffer();
                    updateDownloadProgress();
                    return buf;
                } catch (err) {
                    if (attempt === retries - 1) throw err;
                    await new Promise(function(r) { setTimeout(r, 800 * (attempt + 1)); });
                }
            }
        }

        async function mergeFiles(fileParts) {
            var results = new Array(fileParts.length);
            var nextIdx = 0;
            async function worker() {
                while (nextIdx < fileParts.length) {
                    var idx = nextIdx++;
                    results[idx] = await fetchWithRetry(fileParts[idx], 4);
                }
            }
            await Promise.all([worker(), worker(), worker(), worker()]);
            return URL.createObjectURL(new Blob(results));
        }

        function getParts(file, start, end) {
            var parts = [];
            for (var i = start; i <= end; i++) {
                parts.push(BASE_URL + file + ".part" + i);
            }
            return parts;
        }

        (async function() {
            try {
                var urls = await Promise.all([
                    mergeFiles(getParts("Build/MiSide.data", 1, 8)),
                    mergeFiles(getParts("Build/MiSide.wasm", 1, 2))
                ]);
                var dataUrl = urls[0];
                var wasmUrl = urls[1];

                var canvas = document.querySelector("#unity-canvas");
                var loadingBar = document.querySelector("#unity-loading-bar");
                var progressBarFull = document.querySelector("#unity-progress-bar-full");

                var config = {
                    dataUrl: dataUrl,
                    frameworkUrl: BASE_URL + "Build/MiSide.framework.js",
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: BASE_URL + "StreamingAssets",
                    companyName: "AIHASTO",
                    productName: "MiSide",
                    productVersion: "1.13",
                    cacheControl: function() { return "no-store"; }
                };

                loadingBar.style.display = "block";
                var loaderRes = await fetch(BASE_URL + "Build/MiSide.loader.js");
                (0, eval)(await loaderRes.text());

                createUnityInstance(canvas, config, function(progress) {
                    progressBarFull.style.width = (100 * progress) + "%";
                }).then(function(unityInstance) {
                    loadingBar.style.display = "none";
                    if (loadingOverlay) loadingOverlay.remove();
                }).catch(function(message) {
                    console.error(message);
                    if (loadingText) loadingText.textContent = "Error: " + message;
                });
            } catch (err) {
                console.error(err);
                if (loadingText) loadingText.textContent = "Error: " + err.message;
            }
        })();
    </script>
</body>
</html>
