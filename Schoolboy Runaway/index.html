  <body>
    <div id="loader">
      <div id="text">0 MB / 71 MB</div>
      <div id="bar">
        <div id="fill"></div>
      </div>
    </div>

    <canvas id="unity-canvas"></canvas>

    <script>
      const baseBuild = "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@7512192/Schoolboy%20Runaway/Build/";
      const base = "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@7512192/Schoolboy%20Runaway/";
      const loaderUrl = baseBuild + "Schoolboy%20%20-%20Original.loader.js";

      const MAX_RETRIES = 3;
      const RETRY_DELAY_MS = 1000;

      const partProgress = new Map();
      const totalGuess = 74400000;

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function updateUI() {
        let loaded = 0;
        for (const v of partProgress.values()) loaded += v;
        const mb = (loaded / 1024 / 1024).toFixed(1);
        const total = (totalGuess / 1024 / 1024).toFixed(0);
        document.getElementById("text").textContent = mb + " MB / " + total + " MB";
        document.getElementById("fill").style.width = Math.min(100, (loaded / totalGuess) * 100) + "%";
      }

      async function readPartResponse(response, progressKey) {
        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.byteLength;
          partProgress.set(progressKey, received);
          updateUI();
        }

        const out = new Uint8Array(received);
        let off = 0;
        for (const chunk of chunks) {
          out.set(chunk, off);
          off += chunk.byteLength;
        }
        return out.buffer;
      }

      async function fetchPartWithRetry(url, retries = MAX_RETRIES) {
        for (let attempt = 0; attempt <= retries; attempt++) {
          try {
            if (attempt > 0) {
              partProgress.set(url, 0);
              updateUI();
            }
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status + " for " + url);
            return await readPartResponse(response, url);
          } catch (err) {
            if (attempt < retries) {
              console.warn(`Retry ${attempt + 1}/${retries} for ${url}:`, err.message);
              await sleep(RETRY_DELAY_MS * (attempt + 1));
            } else {
              throw new Error("Failed after " + (retries + 1) + " attempts: " + url);
            }
          }
        }
      }

      const files = [
        { name: "ce4cad6f62be691c4f0dd0be11cc107b.wasm", parts: 3 },
        { name: "ced2911d37d724fc0aaa224ba28e86f0.data", parts: 2 }
      ];

      function buildUrls(file) {
        const urls = [];
        for (let i = 1; i <= file.parts; i++) {
          urls.push(baseBuild + file.name + ".part" + i);
        }
        return urls;
      }

      async function loadFile(file) {
        const urls = buildUrls(file);
        const buffers = await Promise.all(urls.map((url) => fetchPartWithRetry(url)));
        return new Blob(buffers, file.name.endsWith(".wasm") ? { type: "application/wasm" } : undefined);
      }

      async function ensureUnityLoader(url) {
        if (typeof window.createUnityInstance === "function") return;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Failed to load Unity loader (" + res.status + ")");
        const code = await res.text();
        (0, eval)(code);
      }

      async function start() {
        const [wasmBlob, dataBlob] = await Promise.all([
          loadFile(files[0]),
          loadFile(files[1]),
          ensureUnityLoader(loaderUrl)
        ]);

        const wasmUrl = URL.createObjectURL(wasmBlob);
        const dataUrl = URL.createObjectURL(dataBlob);

        document.getElementById("text").textContent = "Starting game...";

        const instance = await window.createUnityInstance(document.querySelector("#unity-canvas"), {
          dataUrl: dataUrl,
          frameworkUrl: baseBuild + "278d31d08ace86d617c05eb22fa1b248.js",
          codeUrl: wasmUrl,
          streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Schoolboy%20Runaway/StreamingAssets",
          companyName: "Linked Squad",
          productName: "SchoolBoy Runaway",
          productVersion: "0.5",
          cacheControl: function () {
            return "no-store";
          }
        });

        window.unityInstance = instance;
        document.getElementById("loader").style.display = "none";
      }

      start().catch(function (err) {
        document.getElementById("text").textContent = "Error: " + err.message;
        console.error(err);
      });
    </script>
  </body>
