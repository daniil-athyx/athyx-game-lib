<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Vex%205/">
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
    <title>Vex 5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Vex%205/assets/css/app.css" type="text/css" />
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Vex%205/vex.jpeg">
  </head>
  <body>
    <div id="content"></div>
    <div id="loader">Loading...</div>
    <div id="orientation"></div>
    <script type="text/javascript">
      var BASE_URL = "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Vex%205/";
      var gameName = "vex-5.min.js";
      window.fbrqLA = false;
      window.fbrqBD = 0;
      window.playBtn = false;
      window.fbrqSA = false;
      window.azCP = false;
      window.gdsdk = {
        showAd: function() { return Promise.resolve(); },
        showBanner: function() { return Promise.resolve(); },
        preloadAd: function() { return Promise.resolve(); },
        init: function() { return Promise.resolve(); },
        sendEvent: function() {},
        getSession: function() { return { location: { parentDomain: window.location.host } }; }
      };
      window.GD_OPTIONS = {
        gameId: "f120262ab72743039fbce88c1f370df8",
        advertisementSettings: { autoplay: false },
        onEvent: function() {}
      };
      var _azerionIntegration = {
        rType: "none",
        af: false,
        sa: true,
        la: "false",
        bd: 0,
        playBtn: "false",
        cp: false
      };

      function addScript(src, buster, callback) {
        var s = document.createElement("script");
        var fullSrc = src.indexOf("http") === 0 ? src : (BASE_URL + src);
        s.setAttribute("src", fullSrc + "?v=" + buster);
        if (typeof callback === "function") {
          s.onload = callback;
        }
        document.body.appendChild(s);
      }

      addScript("version.js", Date.now(), function () {
        addScript(gameName, version, function () {
          var loader = document.getElementById("loader");
          if (loader) loader.style.display = "none";
          new Vex5.Game();
        });
      });
    </script>
  </body>
</html>
