<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Escape%20Road%202/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="25050801/theme/game.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
    <title>Escape Road 2</title>
    <style type="text/css">
        *::-webkit-scrollbar,
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        html, body {
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: #000 !important;
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }

        #unity-container {
            width: 100vw !important;
            height: 100vh !important;
            position: absolute;
            top: 0;
            left: 0;
        }

        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .jss1:before {
            top: 0;
            width: 100%;
            filter: blur(16px);
            height: 100%;
            content: "";
            display: block;
            opacity: .5;
            z-index: 0;
            position: absolute;
            background-size: cover;
            background-image: url("25050801/loading.png");
        }
    </style>
</head>

<body>
<div id="unity-container" style="display: none;">
    <canvas id="unity-canvas"></canvas>
</div>
<div id="loadingBlock">
    <div class="jss31 jss34 jss1">
        <div style="position: absolute; font-family: Arial, Helvetica, sans-serif; bottom: 10px; right: 10px; font-size: 18px; color: #ffffff; opacity: 0.5;">Escape Road 2</div>
        <div class="spinner"></div>
        <div class="jss31 jss34 jss48" style="flex: 1 1 0%;">
            <div class="jss32">
                <div class="jss7 jss9 jss20 jss3">
                    <div class="jss125">
                        <div class="jss123">
                            <img src="25050801/logo.png">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="jss31 jss34" style="flex: 3 1 0%;">
            <div class="jss32">
                <div class="jss31 jss34 jss39 jss50 gameloader">
                    <div class="jss32">
                        <div class="gameloader-game-name">Escape Road 2</div>
                    </div>
                    <div class="jss32">
                        <div class="jss32 gameloader-logo">
                            <img id="game-logo" src="25050801/loading.png">
                        </div>
                    </div>
                    <div class="jss32">
                        <div>
                            <div class="gameloader-progressbar">
                                <div class="gameloader-progressbar-progress" id="progress_fill" style="width: 0%;"></div>
                            </div>
                            <div class="gameloader-progress-info">Game Loading...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var versionFolder = "25050801/";
    var buildUrl = versionFolder + "Build";
    var loaderUrl = buildUrl + "/escape-road-2-v25050801.loader.js";
    var config = {
        dataUrl: buildUrl + "/escape-road-2-v25050801.data.unityweb",
        frameworkUrl: buildUrl + "/escape-road-2-v25050801.framework.js.unityweb",
        codeUrl: buildUrl + "/escape-road-2-v25050801.wasm.unityweb",
        streamingAssetsUrl: versionFolder + "StreamingAssets",
        companyName: "azgames.io",
        productName: "Escape Road 2",
        productVersion: "25050801",
        matchWebGLToCanvasSize: true
    };

    var progressElement = document.getElementById('progress_fill');
    var container = document.getElementById("unity-container");
    var canvas = document.getElementById("unity-canvas");
    var loadingBar = document.querySelector("#loadingBlock");
    var progress_text = document.querySelector(".gameloader-progress-info");

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
            progressElement.style.width = 100 * progress + "%";
            progress_text.innerText = "Downloading assets: " + Math.round(progress * 100) + "%";
            if (progress >= 0.99) {
                progress_text.innerText = "Starting engine...";
            }
        }).then((unityInstance) => {
            window.unityInstance = unityInstance;
            setTimeout(function() {
                loadingBar.style.display = "none";
                container.style.display = "block";
                window.focus();
            }, 800);
        }).catch((message) => {
            console.error("Unity load error:", message);
            alert("Error launching Escape Road 2: " + message);
        });
    };
    document.body.appendChild(script);
</script>
</body>
</html>
